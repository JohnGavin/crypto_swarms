[project]
name = "crypto_alert_t"
description = "Crypto price alerts: Python fetches via Solana APIs, R analyses with dplyr/arrow, Python alerts via Swarms"

[dependencies]

[r-dependencies]
packages = ["dplyr", "arrow", "slider", "ggplot2", "jsonlite", "knitr", "reticulate", "pointblank", "targets", "crew", "duckplyr", "testthat", "usethis", "rmarkdown"]

[py-dependencies]
version = "python313"
packages = ["httpx", "pandas", "pyarrow", "plotly", "pytest", "ipykernel", "nbclient", "nbformat", "pyyaml"]

[additional-tools]
packages = ["quarto", "which"]

[t]
min_version = "0.55.2"
