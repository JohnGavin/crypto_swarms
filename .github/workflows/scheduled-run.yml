name: Scheduled Crypto Pipeline Run

on:
  schedule:
    # Every 12 hours (UTC) - 00:00 and 12:00
    - cron: '0 0,12 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write  # to commit accumulated price_history.csv

concurrency:
  # Serialise runs so two jobs never race to push price history to main.
  group: scheduled-crypto-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for raw wallet addresses
        run: python3 scripts/ci/check_addresses.py $(git ls-files)

      - name: Check for leaked secrets / API keys
        run: python3 scripts/ci/check_secrets.py $(git ls-files)

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            substituters = https://cache.nixos.org https://rstats-on-nix.cachix.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= rstats-on-nix.cachix.org-1:vdiiVgocg6WeJrODIqdprZRUrhi1JzhBnXv7aWI6+F0=

      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: rstats-on-nix

      - name: Build Nix dev shell (retry on transient cache errors)
        run: |
          # cache.nixos.org occasionally resets connections mid-download
          # (seen on run 466 attempt 1). Retry the shell realisation; a
          # persistent failure still fails the step.
          for attempt in 1 2 3; do
            if nix develop --command true; then
              exit 0
            fi
            echo "::warning::nix develop failed (attempt ${attempt}/3); retrying in 30s"
            sleep 30
          done
          echo "::error::nix develop failed after 3 attempts"
          exit 1

      - name: Fetch token prices (outside sandbox - needs network)
        run: nix develop --command python3 scripts/fetch_prices.py

      - name: Run T pipeline
        run: nix develop --command t run src/pipeline.t

      - name: Run Swarms agent (live dispatch on triggered alerts)
        run: nix develop --command python3 scripts/swarms_agent.py
        env:
          SWARMS_DRY_RUN: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GH_REPO: ${{ github.repository }}

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ github.run_number }}
          path: pipeline-output/report/artifact/
          retention-days: 30

      - name: Commit accumulated price history
        if: github.event_name == 'schedule'
        run: |
          # Force-add since data/*.parquet is gitignored locally
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A re-run reuses its original (old) commit; pushing from it is rejected.
          # Skip when this checkout is behind origin/main (a newer run already pushed).
          git fetch origin main
          if ! git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo "::warning::Checkout is behind origin/main (stale re-run?); skipping price-history commit"
            exit 0
          fi
          git add -f data/price_history.parquet 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: append price history (run #${{ github.run_number }})"
          git push
